[project]
name = "fastmcp-python-repl-server"
version = "0.1.0"
description = "FastMCP Python REPL MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "langchain-experimental",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
